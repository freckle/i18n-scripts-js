name: CI

on:
  pull_request:
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: yarn
      - run: yarn install
      - run: yarn build
      - uses: freckle/check-git-clean-action@v1
        with:
          hint: "Run yarn build to update your dist/"
